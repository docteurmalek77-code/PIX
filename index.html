<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIX | Intelligence Artificielle (IA)</title>
    <style>
        :root {
            --primary: #f7931a; /* Orange Bitcoin */
            --accent: #38bdf8;
            --bg: #020617;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #020617 100%);
            color: white;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Logo Bitcoin en fond */
        body::before {
            content: "₿";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40vw;
            color: rgba(247, 147, 26, 0.03);
            z-index: -1;
        }

        nav {
            backdrop-filter: blur(10px);
            background: rgba(0,0,0,0.5);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        nav a:hover { color: var(--primary); }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        /* Titre PIX Géant */
        .hero-title {
            font-size: 8rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to bottom, #fff 30%, #64748b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .sub-title {
            font-size: 1.5rem;
            color: var(--accent);
            letter-spacing: 5px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        input {
            width: 80%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
        }

        button {
            background: linear-gradient(45deg, var(--primary), #ffa433);
            color: black;
            border: none;
            padding: 15px 40px;
            border-radius: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(247, 147, 26, 0.4);
        }

        #res { margin-top: 30px; }

        .price { font-size: 3rem; font-weight: 800; margin: 10px 0; }
        
        /* Signature CryptoMan */
        .creator-tag {
            color: var(--primary);
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin: 15px 0;
            text-transform: uppercase;
        }

        .signal-box {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 900;
            margin-top: 10px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;600;900&display=swap" rel="stylesheet">
</head>
<body>

<nav>
    <a onclick="location.reload()">TERMINAL IA</a>
    <a href="#">TOP 200 ANALYSE</a>
    <a href="#">PIX ACADEMY</a>
</nav>

<div class="container">
    <h1 class="hero-title">PIX</h1>
    <div class="sub-title">INTELLIGENCE ARTIFICIELLE (IA)</div>

    <div class="card">
        <p style="color: #94a3b8; margin-bottom: 20px;">Analyse temps réel du Top 200 Market Cap</p>
        <input type="text" id="coinInp" placeholder="Ex: solana, cardano, polkadot...">
        <br>
        <button onclick="runPIX()">Analyser avec PIX IA</button>

        <div id="res"></div>
    </div>
    
    <p style="margin-top: 30px; color: rgba(255,255,255,0.3); font-size: 0.7rem;">SYSTEME IA V1.0 - CRYPTOMAN NETWORKS</p>
</div>

<script>
    async function runPIX() {
        const query = document.getElementById('coinInp').value.toLowerCase().trim();
        const res = document.getElementById('res');
        if(!query) return;

        res.innerHTML = "<p style='color:var(--accent)'>Calcul des probabilités en cours...</p>";

        try {
            // L'API va chercher parmis les milliers de tokens, donc le Top 200 est inclus d'office
            const resp = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${query}&vs_currencies=usd&include_24hr_change=true`);
            const data = await resp.json();

            if(data[query]) {
                const p = data[query].usd;
                const ch = data[query].usd_24h_change;
                let sig = ch < -5 ? "FORTE OPPORTUNITÉ (ACHAT)" : (ch > 5 ? "ZONE DE DANGER (VENTE)" : "NEUTRE / STABLE");
                let col = ch < -5 ? "#4ade80" : (ch > 5 ? "#f87171" : "#94a3b8");

                res.innerHTML = `
                    <div class="creator-tag">IA CRÉÉE PAR CRYPTOMAN</div>
                    <div class="price">$${p.toLocaleString()}</div>
                    <div class="signal-box" style="background: ${col}22; color: ${col}; border: 1px solid ${col}">
                        ${sig}
                    </div>
                    <p style="color: #64748b; margin-top: 15px;">Variation 24h : ${ch.toFixed(2)}%</p>
                `;
            } else {
                res.innerHTML = "<p style='color:red'>Erreur : Token non reconnu dans la base Top 200.</p>";
            }
        } catch(e) { res.innerHTML = "Erreur de connexion."; }
    }
</script>

</body>
</html>
