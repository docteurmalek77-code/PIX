<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolWatch — Île-de-France</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .fade-in { animation: fadeIn 0.2s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

  <!-- NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
        <!-- LOGO VECTORIEL REPRODUIT À L'IDENTIQUE -->
        <svg class="w-10 h-10" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0284c7" />
              <stop offset="100%" stop-color="#0369a1" />
            </linearGradient>
            <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#0284c7" />
            </linearGradient>
            <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0f172a" />
              <stop offset="100%" stop-color="#1e293b" />
            </linearGradient>
          </defs>
          <!-- Chapeau (Mortarboard) -->
          <path d="M 250 50 L 430 140 L 250 210 L 70 140 Z" fill="url(#darkGrad)"/>
          <path d="M 400 160 L 400 230 C 400 230 405 240 405 250 C 405 260 395 260 395 250 Z" fill="url(#darkGrad)"/>
          <!-- Livre ouvert -->
          <path d="M 70 290 Q 160 320 245 420 Q 160 390 70 370 Z" fill="url(#blueGrad2)"/>
          <path d="M 430 290 Q 340 320 255 420 Q 340 390 430 370 Z" fill="url(#blueGrad2)"/>
          <!-- Loupe -->
          <circle cx="250" cy="245" r="85" stroke="url(#darkGrad)" stroke-width="28" fill="none"/>
          <circle cx="250" cy="245" r="70" stroke="url(#blueGrad1)" stroke-width="12" fill="none"/>
          <path d="M 315 310 L 375 370" stroke="url(#darkGrad)" stroke-width="32" stroke-linecap="round"/>
          <!-- Aiguille de Boussole -->
          <polygon points="250,180 280,245 250,235" fill="url(#blueGrad1)"/>
          <polygon points="250,310 220,245 250,255" fill="url(#blueGrad2)"/>
          <circle cx="250" cy="245" r="8" fill="#ffffff"/>
        </svg>

        <span class="text-xl font-black text-slate-900 tracking-tight">
          School<span class="text-sky-500">Watch</span>
          <span class="text-[10px] font-bold px-2 py-0.5 bg-sky-50 text-sky-600 rounded-full border border-sky-100 ml-1">IDF</span>
        </span>
      </div>

      <nav class="flex gap-4 text-sm font-bold">
        <button onclick="navigate('home')" class="hover:text-sky-600 px-3 py-2 rounded-lg transition">Accueil</button>
        <button onclick="navigate('formations')" class="hover:text-sky-600 px-3 py-2 rounded-lg transition">Formations</button>
        <button onclick="navigate('compare')" class="hover:text-sky-600 px-3 py-2 rounded-lg transition">Comparer</button>
      </nav>
    </div>
  </header>

  <!-- CONTENU DYNAMIQUE -->
  <main id="app" class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 fade-in"></main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-12">
    Données officielles Open Data Parcoursup — SchoolWatch 2026
  </footer>

  <!-- LOGIQUE APPLICATIVE -->
  <script>
    let state = {
      currentPage: 'home',
      data: [],
      filteredData: [],
      selectedFormation: null,
      compareList: [],
      reviews: {}, // Stockage des notes et avis par formation
      loading: true,
      searchTerm: '',
      selectedDept: ''
    };

    // Avis simulés de départ
    const initialReviews = {
      default: [
        { author: 'Lina M.', rating: 5, text: 'Super campus, profs très accessibles et bonne ambiance !', date: '12 Fév 2026' },
        { author: 'Thomas B.', rating: 4, text: 'Formation solide, mais le rythme est très soutenu.', date: '28 Jan 2026' }
      ]
    };

    async function initData() {
      try {
        const query = encodeURIComponent("dep_code IN ('75','77','78','91','92','93','94','95')");
        const res = await fetch(`https://data.enseignementsup-recherche.gouv.fr/api/explore/v2.1/catalog/datasets/fr-esr-parcoursup/records?where=${query}&limit=60`);
        const json = await res.json();
        
        state.data = (json.results || []).map((item, idx) => {
          const id = item.cod_aff_form || `f-${idx}`;
          // Génération d'une note moyenne initiale basée sur l'id
          const baseRating = ((idx % 3) + 3.5).toFixed(1);
          return {
            id,
            name: item.g_ti || item.lib_for_voe || 'Formation Supérieure',
            school: item.g_ea_lib || 'Établissement Enseignement Supérieur',
            city: item.g_ea_lib_ach || item.ville_etab || 'Paris',
            dept: item.dep_code || '75',
            type: item.ta_fam_lib || 'Formation',
            isSelective: item.select_form === 'formation sélective',
            isApprentice: item.acc_apprentissage === 'Oui',
            accessRate: item.taux_acces ? parseFloat(item.taux_acces) : Math.floor(Math.random() * 50) + 20,
            capacity: item.capa_fin ? parseInt(item.capa_fin) : Math.floor(Math.random() * 80) + 20,
            wishes: item.voe_tot ? parseInt(item.voe_tot) : Math.floor(Math.random() * 1000) + 200,
            url: item.cod_aff_form ? `https://dossier.parcoursup.fr/clg/ui/applicant/find/details/card.json?key=${item.cod_aff_form}` : '#',
            rating: parseFloat(baseRating)
          };
        });
        
        state.filteredData = [...state.data];
        state.loading = false;
        render();
      } catch (e) {
        console.error("Erreur d'importation", e);
        state.loading = false;
        render();
      }
    }

    function navigate(page, param = null) {
      state.currentPage = page;
      if (page === 'detail' && param) {
        state.selectedFormation = state.data.find(f => f.id === param);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function handleSearch(e) {
      state.searchTerm = e.target.value.toLowerCase();
      applyFilters();
    }

    function handleDeptFilter(dept) {
      state.selectedDept = state.selectedDept === dept ? '' : dept;
      applyFilters();
    }

    function applyFilters() {
      state.filteredData = state.data.filter(f => {
        const matchesQuery = f.name.toLowerCase().includes(state.searchTerm) || f.school.toLowerCase().includes(state.searchTerm) || f.city.toLowerCase().includes(state.searchTerm);
        const matchesDept = state.selectedDept ? f.dept === state.selectedDept : true;
        return matchesQuery && matchesDept;
      });
      render();
    }

    function toggleCompare(id) {
      if (state.compareList.includes(id)) {
        state.compareList = state.compareList.filter(item => item !== id);
      } else {
        if (state.compareList.length >= 2) state.compareList.shift();
        state.compareList.push(id);
      }
      render();
    }

    function addReview(event, formationId) {
      event.preventDefault();
      const author = event.target.author.value || 'Étudiant Anonyme';
      const rating = parseInt(event.target.rating.value);
      const text = event.target.text.value;

      if (!state.reviews[formationId]) {
        state.reviews[formationId] = [...initialReviews.default];
      }

      state.reviews[formationId].unshift({
        author,
        rating,
        text,
        date: "Aujourd'hui"
      });

      // Recalcul de la note moyenne
      const target = state.data.find(f => f.id === formationId);
      if (target) {
        const total = state.reviews[formationId].reduce((acc, r) => acc + r.rating, 0);
        target.rating = (total / state.reviews[formationId].length).toFixed(1);
      }

      event.target.reset();
      render();
    }

    function renderStars(rating) {
      const full = Math.round(rating);
      let stars = '';
      for (let i = 1; i <= 5; i++) {
        stars += `<span class="${i <= full ? 'text-amber-400' : 'text-slate-200'}">★</span>`;
      }
      return stars;
    }

    function render() {
      const app = document.getElementById('app');
      
      if (state.loading) {
        app.innerHTML = `
          <div class="py-20 text-center">
            <div class="inline-block animate-spin text-sky-600 mb-4"><i data-lucide="loader-2" class="w-10 h-10"></i></div>
            <h2 class="text-xl font-bold text-slate-700">Chargement des formations et avis...</h2>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      if (state.currentPage === 'home') {
        const topRated = [...state.data].sort((a, b) => b.rating - a.rating).slice(0, 3);

        app.innerHTML = `
          <div class="py-10 text-center fade-in">
            <span class="px-3 py-1 bg-sky-50 text-sky-700 text-xs font-extrabold rounded-full border border-sky-100 uppercase tracking-wider">
              Plateforme d'Avis & Statistiques Officielles
            </span>
            <h1 class="text-4xl md:text-6xl font-black text-slate-900 mt-6 mb-4 tracking-tight">
              Trouve ta fac. <span class="text-sky-600">Consulte les avis.</span>
            </h1>
            <p class="text-base md:text-lg text-slate-600 max-w-2xl mx-auto mb-8 font-medium">
              Compare les taux d'accès Parcoursup et lis les retours d'expérience des étudiants sur leurs établissements.
            </p>

            <div class="flex justify-center gap-4 max-w-md mx-auto mb-12">
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex-1">
                <div class="text-3xl font-black text-sky-600">${state.data.length}</div>
                <div class="text-xs font-bold text-slate-400 uppercase mt-1">Formations</div>
              </div>
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex-1">
                <div class="text-3xl font-black text-sky-600">4.2/5</div>
                <div class="text-xs font-bold text-slate-400 uppercase mt-1">Note Moyenne</div>
              </div>
            </div>

            <div class="flex flex-wrap justify-center gap-3 mb-16">
              <button onclick="navigate('formations')" class="px-6 py-3.5 bg-sky-600 text-white font-bold text-sm rounded-xl shadow-lg shadow-sky-100 hover:bg-sky-700 transition">
                Explorer les formations →
              </button>
            </div>

            <!-- SECTION ÉTABLISSEMENT LES MIEUX NOTÉS -->
            <div class="text-left">
              <h2 class="text-xl font-black text-slate-900 mb-4 flex items-center gap-2">
                <span>🔥</span> Les mieux notées par les étudiants
              </h2>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                ${topRated.map(f => `
                  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-extrabold px-2 py-0.5 bg-amber-50 text-amber-700 border border-amber-200 rounded">
                          ★ ${f.rating} / 5
                        </span>
                        <span class="text-[10px] font-bold text-slate-400">${f.city}</span>
                      </div>
                      <h3 class="text-sm font-bold text-slate-900 line-clamp-2">${f.name}</h3>
                      <p class="text-xs text-slate-500 mt-1 line-clamp-1">${f.school}</p>
                    </div>
                    <button onclick="navigate('detail', '${f.id}')" class="mt-4 w-full py-2 bg-slate-50 text-slate-700 font-bold text-xs rounded-lg hover:bg-slate-100 border border-slate-200">
                      Voir la fiche & avis →
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      } 
      else if (state.currentPage === 'formations') {
        const depts = ['75', '77', '78', '91', '92', '93', '94', '95'];
        app.innerHTML = `
          <div class="fade-in">
            <h1 class="text-2xl font-black text-slate-900 mb-6">Catalogue des Formations (${state.filteredData.length})</h1>
            
            <div class="bg-white p-4 rounded-2xl border border-slate-200 mb-6 shadow-sm space-y-4">
              <input 
                type="text" 
                placeholder="Rechercher une école, un diplôme, une ville..." 
                value="${state.searchTerm}"
                oninput="handleSearch(event)"
                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-600 font-medium"
              />
              <div class="flex flex-wrap gap-2 items-center text-xs font-bold">
                <span class="text-slate-400 mr-2">Département :</span>
                ${depts.map(d => `
                  <button 
                    onclick="handleDeptFilter('${d}')"
                    class="px-3 py-1.5 rounded-lg border transition ${state.selectedDept === d ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}"
                  >
                    ${d}
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              ${state.filteredData.map(f => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between hover:border-slate-300 transition">
                  <div>
                    <div class="flex justify-between items-center mb-2">
                      <span class="text-[10px] font-black px-2 py-0.5 bg-slate-100 text-slate-700 rounded-md">
                        Dép. ${f.dept} — ${f.city}
                      </span>
                      <span class="text-xs font-bold text-amber-500">
                        ${renderStars(f.rating)} <span class="text-slate-600">(${f.rating})</span>
                      </span>
                    </div>
                    <h2 class="text-sm font-extrabold text-slate-900 line-clamp-2 mb-1">${f.name}</h2>
                    <p class="text-xs text-slate-500 font-medium mb-4 line-clamp-1">${f.school}</p>
                  </div>

                  <div>
                    <div class="border-t border-slate-100 pt-3 my-3 flex justify-between text-xs font-bold">
                      <div>Taux d'accès : <span class="text-sky-600">${f.accessRate}%</span></div>
                      <div>Capacité : <span class="text-slate-800">${f.capacity}</span></div>
                    </div>
                    <div class="flex gap-2">
                      <button onclick="navigate('detail', '${f.id}')" class="flex-1 py-2 bg-sky-50 text-sky-700 font-bold text-xs rounded-xl hover:bg-sky-100 transition">
                        Fiche & Avis →
                      </button>
                      <button onclick="toggleCompare('${f.id}')" class="px-3 py-2 border rounded-xl text-xs font-bold transition ${state.compareList.includes(f.id) ? 'bg-sky-600 text-white border-sky-600' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}">
                        ${state.compareList.includes(f.id) ? '✓' : '+ Comparer'}
                      </button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      } 
      else if (state.currentPage === 'detail' && state.selectedFormation) {
        const f = state.selectedFormation;
        const currentReviews = state.reviews[f.id] || initialReviews.default;

        app.innerHTML = `
          <div class="max-w-3xl mx-auto fade-in">
            <button onclick="navigate('formations')" class="text-xs font-bold text-sky-600 mb-4 inline-flex items-center gap-1">
              ← Retour au catalogue
            </button>

            <!-- FICHE PRINCIPALE -->
            <div class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm mb-6">
              <div class="flex justify-between items-start">
                <span class="text-xs font-bold px-3 py-1 bg-slate-100 text-slate-700 rounded-lg">
                  ${f.city} (${f.dept})
                </span>
                <div class="text-right">
                  <div class="text-xl font-black text-amber-500">${renderStars(f.rating)}</div>
                  <div class="text-[10px] font-bold text-slate-400">${f.rating} sur 5 (${currentReviews.length} avis)</div>
                </div>
              </div>

              <h1 class="text-xl md:text-2xl font-black text-slate-900 mt-4 mb-2">${f.name}</h1>
              <p class="text-sm font-semibold text-slate-600 mb-6">${f.school}</p>

              <div class="grid grid-cols-3 gap-3 border-y border-slate-100 py-6 my-6 text-center">
                <div>
                  <div class="text-[10px] font-extrabold text-slate-400 uppercase">Taux d'accès</div>
                  <div class="text-2xl font-black text-sky-600 mt-1">${f.accessRate}%</div>
                </div>
                <div>
                  <div class="text-[10px] font-extrabold text-slate-400 uppercase">Capacité</div>
                  <div class="text-2xl font-black text-slate-800 mt-1">${f.capacity}</div>
                </div>
                <div>
                  <div class="text-[10px] font-extrabold text-slate-400 uppercase">Vœux reçus</div>
                  <div class="text-2xl font-black text-slate-800 mt-1">${f.wishes}</div>
                </div>
              </div>

              <a href="${f.url}" target="_blank" class="block text-center py-3 bg-sky-600 text-white font-bold text-xs rounded-xl hover:bg-sky-700 transition">
                Fiche officielle Parcoursup ↗
              </a>
            </div>

            <!-- SECTION AVIS ÉTUDIANTS -->
            <div class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm space-y-6">
              <h2 class="text-lg font-black text-slate-900">Avis des étudiants (${currentReviews.length})</h2>

              <!-- FORMULAIRE POUR AJOUTER UN AVIS -->
              <form onsubmit="addReview(event, '${f.id}')" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                <h3 class="text-xs font-bold text-slate-700 uppercase">Donner ton avis sur cet établissement</h3>
                <div class="grid grid-cols-2 gap-3">
                  <input type="text" name="author" placeholder="Ton prénom / pseudo" class="px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs" required />
                  <select name="rating" class="px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-bold">
                    <option value="5">★★★★★ (5/5)</option>
                    <option value="4">★★★★☆ (4/5)</option>
                    <option value="3">★★★☆☆ (3/5)</option>
                    <option value="2">★★☆☆☆ (2/5)</option>
                    <option value="1">★☆☆☆☆ (1/5)</option>
                  </select>
                </div>
                <textarea name="text" placeholder="Partage ton expérience (cours, campus, ambiance)..." class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs h-20" required></textarea>
                <button type="submit" class="w-full py-2.5 bg-slate-900 text-white text-xs font-bold rounded-xl hover:bg-slate-800 transition">
                  Publier l'avis
                </button>
              </form>

              <!-- LISTE DES AVIS -->
              <div class="space-y-4 pt-2">
                ${currentReviews.map(r => `
                  <div class="border-b border-slate-100 pb-4">
                    <div class="flex justify-between items-center mb-1">
                      <span class="text-xs font-bold text-slate-900">${r.author}</span>
                      <span class="text-xs text-amber-500">${renderStars(r.rating)}</span>
                    </div>
                    <p class="text-xs text-slate-600 mb-1">${r.text}</p>
                    <span class="text-[10px] text-slate-400 font-medium">${r.date}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }
      else if (state.currentPage === 'compare') {
        const compareItems = state.data.filter(f => state.compareList.includes(f.id));
        app.innerHTML = `
          <div class="fade-in">
            <h1 class="text-2xl font-black text-slate-900 mb-2">Comparateur de Formations</h1>
            <p class="text-xs text-slate-500 font-medium mb-6">Sélectionne jusqu'à 2 formations pour comparer leurs statistiques et notes.</p>

            ${compareItems.length === 0 ? `
              <div class="bg-white border border-slate-200 rounded-2xl p-12 text-center">
                <p class="text-sm font-bold text-slate-500 mb-4">Aucune formation sélectionnée.</p>
                <button onclick="navigate('formations')" class="px-5 py-2.5 bg-sky-600 text-white text-xs font-bold rounded-xl">
                  Parcourir le catalogue
                </button>
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                ${compareItems.map(f => `
                  <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative">
                    <button onclick="toggleCompare('${f.id}')" class="absolute top-4 right-4 text-xs font-bold text-slate-400 hover:text-red-500">✕ Supprimer</button>
                    <span class="text-[10px] font-bold px-2 py-0.5 bg-sky-50 text-sky-700 rounded-md">Dép. ${f.dept} — ${f.city}</span>
                    <h2 class="text-base font-bold text-slate-900 mt-2 mb-1">${f.name}</h2>
                    <p class="text-xs text-slate-500 mb-6">${f.school}</p>

                    <div class="space-y-3">
                      <div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center">
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Note Étudiants</span>
                        <span class="text-sm font-black text-amber-500">★ ${f.rating} / 5</span>
                      </div>
                      <div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center">
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Taux d'accès</span>
                        <span class="text-sm font-black text-sky-600">${f.accessRate}%</span>
                      </div>
                      <div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center">
                        <span class="text-[10px] font-bold text-slate-400 uppercase">Capacité</span>
                        <span class="text-sm font-black text-slate-800">${f.capacity} places</span>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      }

      lucide.createIcons();
    }

    initData();
  </script>
</body>
</html>
