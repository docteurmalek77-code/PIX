<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>PIX | IA Crypto by Abdelmalek</title>
    <style>
        /* Changement du thème en ROUGE et NOIR */
        :root { --neon: #ff4d4d; --bg: #0a0000; --card: #1a0505; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: white; margin: 0; padding: 0; }
        nav { background: #000; padding: 15px; display: flex; justify-content: center; gap: 20px; border-bottom: 2px solid var(--neon); }
        nav a { color: white; text-decoration: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        nav a:hover { color: var(--neon); }
        .content { display: flex; flex-direction: column; align-items: center; padding: 40px; min-height: 80vh; }
        .section { display: none; width: 100%; max-width: 600px; text-align: center; }
        .active { display: block; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid var(--neon); margin-top: 20px; box-shadow: 0 0 20px rgba(255, 77, 77, 0.2); }
        h1 { margin-top: 0; color: var(--neon); text-shadow: 0 0 10px rgba(255, 77, 77, 0.5); }
        input { padding: 12px; border-radius: 8px; border: 1px solid var(--neon); background: #000; color: white; width: 70%; margin-bottom: 15px; outline: none; }
        button { background: var(--neon); color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #ff0000; transform: scale(1.05); }
        .formation-item { text-align: left; background: #2a0a0a; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid var(--neon); }
        #res { margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; }
        .signature { color: var(--neon); font-size: 0.9em; font-weight: bold; margin-top: 10px; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

<nav>
    <a onclick="show('detector')">DETECTEUR IA</a>
    <a onclick="show('academy')">PIX ACADEMY</a>
</nav>

<div class="content">
    <div id="detector" class="section active">
        <h1>PIX <span style="color:white">DETECTOR</span></h1>
        <p>L'IA de surveillance par Abdelmalek</p>
        <div class="card">
            <input type="text" id="cryptoInput" placeholder="Ex: bitcoin, solana, eth">
            <br>
            <button onclick="analyze()">LANCER L'ANALYSE IA</button>
            <div id="res"></div>
        </div>
    </div>

    <div id="academy" class="section">
        <h1>PIX <span style="color:white">ACADEMY</span></h1>
        <div class="card">
            <div class="formation-item">📚 <b>Module 1:</b> Bases Crypto</div>
            <div class="formation-item">📉 <b>Module 2:</b> Analyse IA</div>
            <div class="formation-item">🛡️ <b>Module 3:</b> Sécurité</div>
        </div>
    </div>
</div>

<script>
    function show(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function analyze() {
        const coin = document.getElementById('cryptoInput').value.toLowerCase().trim();
        const res = document.getElementById('res');
        if(!coin) return;

        res.innerHTML = "Analyse en cours...";
        
        try {
            const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coin}&vs_currencies=usd&include_24hr_change=true`);
            const data = await response.json();
            
            const change = data[coin].usd_24h_change;
            const price = data[coin].usd;
            
            let verdict = change < -5 ? "ACHAT" : (change > 5 ? "VENTE" : "STABLE");
            
            res.innerHTML = `
                <div style="border-top: 1px solid var(--neon); padding-top: 15px;">
                    <p style="font-size: 1.8em; margin: 5px 0;">$${price.toLocaleString()}</p>
                    <div class="signature">Détecté par Abdelmalek</div>
                    <p style="margin-top:20px;">SIGNAL : ${verdict}</p>
                    <p style="font-size: 0.8em;">Variation: ${change.toFixed(2)}%</p>
                </div>
            `;
        } catch(e) { res.innerText = "Erreur."; }
    }
</script>

</body>
</html>
