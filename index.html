<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIX | Top 10 Crypto Intelligence</title>
    <style>
        :root {
            --violet: #8b5cf6;
            --bg: #05020d;
            --up: #00ffaa;
            --down: #ff3355;
            --border: rgba(139, 92, 246, 0.4);
        }

        * { box-sizing: border-box; transition: 0.3s ease; }

        body {
            font-family: 'Lexend', sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at top center, rgba(139, 92, 246, 0.15), transparent);
            color: white; margin: 0; min-height: 100vh; overflow-x: hidden;
        }

        /* --- BARRE TOP 10 (FIXE & PROPRE) --- */
        .top-10-bar {
            position: fixed; top: 0; width: 100%; z-index: 2000;
            background: rgba(5, 2, 13, 0.95); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }
        .ticker-wrap { display: flex; overflow: hidden; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .ticker-move { display: flex; animation: scroll 50s linear infinite; gap: 50px; white-space: nowrap; }
        .t-item { font-size: 0.8rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .t-item i { color: var(--violet); font-style: normal; font-weight: 400; opacity: 0.7; }
        
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* --- HEADER --- */
        .hero { text-align: center; padding: 140px 20px 40px; }
        .hero h1 { 
            font-size: clamp(5rem, 15vw, 9rem); font-weight: 900; margin: 0;
            background: linear-gradient(to bottom, #fff, var(--violet));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            line-height: 0.8;
        }
        .tagline { color: var(--violet); letter-spacing: 8px; font-weight: 800; text-transform: uppercase; margin-top: 20px; font-size: 0.8rem; }

        /* --- CARDS --- */
        .container { max-width: 1100px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 30px; }
        .card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border);
            border-radius: 40px; padding: 40px; backdrop-filter: blur(20px);
        }
        .card:hover { border-color: #fff; box-shadow: 0 0 30px rgba(139, 92, 246, 0.2); }

        /* --- SELECTEUR AMÉLIORÉ (CYBER STYLE) --- */
        .custom-select-wrapper { position: relative; width: 100%; margin-bottom: 25px; }
        select {
            width: 100%; background: #000; border: 2px solid var(--border);
            padding: 20px; border-radius: 20px; color: white; font-family: 'Lexend';
            font-size: 1rem; outline: none; appearance: none; cursor: pointer;
            text-align: center; font-weight: 600;
        }
        select:hover { border-color: #fff; }
        .custom-select-wrapper::after {
            content: '▼'; position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            color: var(--violet); pointer-events: none; font-size: 0.8rem;
        }

        input {
            width: 100%; background: #000; border: 2px solid var(--border);
            padding: 20px; border-radius: 20px; color: white; font-family: 'Lexend';
            font-size: 1rem; outline: none; text-align: center; margin-bottom: 25px;
        }

        .btn {
            width: 100%; padding: 20px; border-radius: 20px; border: none;
            background: #fff; color: #000; font-weight: 900; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .btn:hover { background: var(--violet); color: #fff; box-shadow: 0 0 20px var(--violet); }

        .res {
            margin-top: 25px; padding: 25px; border-radius: 25px; min-height: 150px;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }

        .warning {
            margin-top: 50px; padding: 30px; border-left: 4px solid var(--down);
            background: rgba(255, 51, 85, 0.05); border-radius: 0 20px 20px 0;
            font-size: 0.9rem; line-height: 1.6; color: #94a3b8;
        }

        footer { text-align: center; padding: 60px; color: #334155; font-size: 0.7rem; letter-spacing: 4px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="top-10-bar">
    <div class="ticker-wrap"><div class="ticker-move" id="p-row"></div></div>
    <div class="ticker-wrap"><div class="ticker-move" id="c-row"></div></div>
</div>

<div class="hero">
    <h1>PIX</h1>
    <div class="tagline">Top 10 Crypto Intelligence</div>
    <div style="font-size: 0.6rem; letter-spacing: 4px; color: rgba(255,255,255,0.2); margin-top: 10px;">PROPRIÉTÉ DE CRYPTOMAN</div>
</div>

<div class="container">
    <div class="grid">
        <div class="card">
            <h3 style="text-align:center; letter-spacing:3px;">TERMINAL</h3>
            <input type="text" id="coinInp" placeholder="SYMBOLE (BTC, SOL...)">
            <button class="btn" onclick="analyse()">Analyser</button>
            <div id="resAnalyse" class="res"><span style="opacity:0.3;">PRÊT</span></div>
        </div>

        <div class="card">
            <h3 style="text-align:center; letter-spacing:3px;">ACADÉMIE</h3>
            <div class="custom-select-wrapper">
                <select id="lvl">
                    <option value="1">Niveau : Débutant</option>
                    <option value="2">Niveau : Intermédiaire</option>
                    <option value="3">Niveau : Expert</option>
                </select>
            </div>
            <button class="btn" onclick="lesson()">Générer</button>
            <div id="resLvl" class="res"><span style="opacity:0.3;">SÉLECTIONNEZ</span></div>
        </div>
    </div>

    <div class="warning">
        <b style="color:var(--down)">ATTENTION :</b> Le marché crypto est volatil. PIX est un outil éducatif. Ne misez pas ce que vous ne pouvez pas perdre. CryptoMan Networks décline toute responsabilité.
    </div>
</div>

<footer>© 2026 CRYPTOMAN NETWORKS</footer>

<script>
    // TOP 10 CRYPTO LIST (Ordre exact Market Cap)
    const top10 = ['bitcoin','ethereum','tether','binancecoin','solana','ripple','usd-coin','dogecoin','staked-ether','cardano'];

    async function sync() {
        try {
            const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${top10.join(',')}&vs_currencies=usd&include_24hr_change=true`);
            const d = await r.json();
            let pHTML = "", cHTML = "";

            top10.forEach(id => {
                const s = id === 'bitcoin' ? 'BTC' : id === 'ethereum' ? 'ETH' : id === 'binancecoin' ? 'BNB' : id === 'tether' ? 'USDT' : id === 'usd-coin' ? 'USDC' : id.substring(0,3).toUpperCase();
                const p = d[id].usd;
                const c = d[id].usd_24h_change;
                const col = c >= 0 ? 'var(--up)' : 'var(--down)';

                pHTML += `<div class="t-item"><i>${s}</i> $${p.toLocaleString()}</div>`;
                cHTML += `<div class="t-item"><i>${s}</i> <b style="color:${col}">${c >= 0 ? '+':''}${c.toFixed(2)}%</b></div>`;
            });
            document.getElementById('p-row').innerHTML = pHTML + pHTML;
            document.getElementById('c-row').innerHTML = cHTML + cHTML;
        } catch(e) {}
    }

    sync(); setInterval(sync, 30000);

    async function analyse() {
        const i = document.getElementById('coinInp').value.toLowerCase().trim();
        const rBox = document.getElementById('resAnalyse');
        if(!i) return;
        rBox.innerHTML = "SCAN...";
        try {
            const map = {'btc':'bitcoin','eth':'ethereum','sol':'solana','bnb':'binancecoin'};
            const id = map[i] || i;
            const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd&include_24hr_change=true`);
            const d = await r.json();
            if(d[id]) {
                const c = d[id].usd_24h_change;
                rBox.innerHTML = `<div style="font-size:2.5rem; font-weight:900;">$${d[id].usd.toLocaleString()}</div>
                                 <div style="color:${c>=0?'var(--up)':'var(--down)'}; font-weight:bold;">${c>0?'▲':'▼'} ${c.toFixed(2)}%</div>`;
            } else { rBox.innerHTML = "INTROUVABLE"; }
        } catch(e) { rBox.innerHTML = "ERREUR"; }
    }

    function lesson() {
        const l = document.getElementById('lvl').value;
        const r = document.getElementById('resLvl');
        const txt = {
            '1': "<b>Débutant :</b> Bitcoin est limité à 21 millions d'unités. C'est ce qu'on appelle la rareté numérique.",
            '2': "<b>Intermédiaire :</b> Apprenez à utiliser le RSI pour savoir quand une crypto est sur-achetée ou sur-vendue.",
            '3': "<b>Expert :</b> Analyse des Smart Contracts et gestion de liquidité sur les protocoles DeFi."
        };
        r.innerHTML = `<div style="font-size:0.9rem; line-height:1.5;">${txt[l]}</div>`;
    }
</script>
</body>
</html>
